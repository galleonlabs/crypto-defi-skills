# PR definitions come from the trusted base; the job guard rejects fork heads
# before runner admission. Trusted PRs check their exact head SHA.
# GitHub-hosted runners keep this public repository's CI off dappnode.
name: CI
on:
  push:
    branches:
      - main
  pull_request_target: null
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with runner git
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        run: |-
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [[ ! -d .git ]]; then
            git init
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" fetch --force --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" "$CHECKOUT_SHA"
          unset header
          git checkout --force --detach "$CHECKOUT_SHA"
          git clean -ffdx -e 'node_modules/' -e '**/node_modules/'
          git log -1 --oneline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Smoke packs every workspace and checks the installed tarballs; a separate
      # dry-run pack repeats the same npm packaging pass without extra coverage.
      - run: bun run smoke
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
