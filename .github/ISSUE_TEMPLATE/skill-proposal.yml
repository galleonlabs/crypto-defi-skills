name: Skill proposal
description: Propose a protocol, workflow, or failure case
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: trigger
    attributes:
      label: User trigger
      description: Give three prompts that should load this behavior and two that should not.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Link current protocol docs, contracts, specifications, audits, or public receipts.
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Failure behavior
      description: What must the skill reject, stop, or mark unknown?
    validations:
      required: true
